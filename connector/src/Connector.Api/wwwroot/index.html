<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC Water Connector</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --ink: #1a2332; --muted: #64748b;
    --line: #e2e8f0; --accent: #0066cc; --accent-ink: #ffffff;
    --draft: #94a3b8; --inreview: #d97706; --approved: #16a34a; --rejected: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #0b1f3a; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .tag { font-size: 11px; background: #1d4ed8; padding: 2px 8px; border-radius: 10px; }
  header .spacer { flex: 1; }
  select, button { font: inherit; }
  select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .badge.Draft { background: var(--draft); } .badge.InReview { background: var(--inreview); }
  .badge.Approved { background: var(--approved); } .badge.Rejected { background: var(--rejected); }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.1); color: var(--accent-ink); }
  .muted { color: var(--muted); font-size: 12px; }
  .meta-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .checkout-banner { padding: 10px 14px; border-radius: 8px; background: #fef3c7; border: 1px solid #f59e0b; margin-bottom: 12px; font-size: 13px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #0b1f3a; color: #fff; padding: 12px 18px; border-radius: 8px; opacity: 0; transition: opacity .3s; max-width: 420px; }
  .toast.show { opacity: 1; }
  .row-flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ACC Water Connector</h1><span class="tag">Phase 2</span>
  <span class="spacer"></span>
  <label class="muted" style="color:#cbd5e1">Acting as&nbsp;</label>
  <select id="user">
    <option value="admin@demo.local">Ada Admin (Admin)</option>
    <option value="modeler@demo.local">Asha Modeler (Modeler)</option>
    <option value="reviewer@demo.local">Ravi Reviewer (Reviewer)</option>
    <option value="viewer@demo.local">Vik Viewer (Viewer)</option>
  </select>
</header>
<main>
  <div class="card">
    <h2>Models</h2>
    <div class="row-flex">
      <select id="model"></select>
      <span id="acc-link" class="muted"></span>
    </div>
    <div id="checkout-area" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>Version history</h2>
    <div id="versions"></div>
  </div>
  <div class="card">
    <h2>Audit trail <span id="audit-export" style="font-weight:normal;text-transform:none"></span></h2>
    <div id="audit"></div>
  </div>
</main>
<div id="toast" class="toast"></div>

<div id="map-modal" style="display:none;position:fixed;inset:0;background:rgba(11,31,58,.75);z-index:50" onclick="if(event.target===this)this.style.display='none'">
  <div style="background:#fff;border-radius:12px;max-width:900px;margin:4vh auto;padding:18px 22px">
    <div class="row-flex" style="justify-content:space-between;margin-bottom:8px">
      <b id="map-title">Network map</b>
      <span>
        <span class="muted" style="margin-right:14px">
          <span style="color:#16a34a">●</span> junction&nbsp;
          <span style="color:#2563eb">■</span> tank&nbsp;
          <span style="color:#7c3aed">▲</span> reservoir&nbsp;
          <span style="color:#94a3b8">—</span> pipe
        </span>
        <button class="btn" onclick="document.getElementById('map-modal').style.display='none'">Close</button>
      </span>
    </div>
    <svg id="map-svg" viewBox="0 0 800 600" style="width:100%;height:70vh;background:#f8fafc;border:1px solid var(--line);border-radius:8px"></svg>
    <div id="map-stats" class="muted" style="margin-top:6px"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let projects = [], currentModel = null;

const hdrs = () => ({ 'X-Dev-User': $('user').value, 'Content-Type': 'application/json' });
async function api(path, opts = {}) {
  const res = await fetch('/api/v1' + path, { headers: hdrs(), ...opts });
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw (body || { message: 'HTTP ' + res.status });
  return body;
}
function toast(msg, ok = true) {
  const t = $('toast'); t.textContent = msg; t.style.background = ok ? '#14532d' : '#7f1d1d';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500);
}
const fmtDate = s => new Date(s).toLocaleString();

async function loadProjects() {
  projects = (await api('/projects')).projects;
  const sel = $('model'); sel.innerHTML = '';
  for (const p of projects) for (const m of p.models)
    sel.add(new Option(`${p.name} / ${m.name}`, m.id));
  if (sel.options.length) { currentModel = sel.value; await refresh(); }
}

async function refresh() {
  currentModel = $('model').value;
  await Promise.all([loadCheckout(), loadVersions(), loadAudit()]);
}

async function loadCheckout() {
  const area = $('checkout-area');
  try {
    const { checkoutState: c } = await api(`/models/${currentModel}/checkout`);
    area.innerHTML = c
      ? `<div class="checkout-banner">🔒 Checked out by <b>${c.checkedOutBy.name}</b> since ${fmtDate(c.checkedOutAt)} (expires ${fmtDate(c.expiresAt)})
         <button class="btn" onclick="releaseCheckout()">Release</button></div>`
      : `<button class="btn" onclick="acquireCheckout(false)">Check out this model</button><span class="muted"> — signals to others you're editing it</span>`;
  } catch (e) { area.innerHTML = `<span class="muted">${e.message || ''}</span>`; }
}
async function acquireCheckout(override) {
  try {
    await api(`/models/${currentModel}/checkout`, { method: 'POST', body: JSON.stringify({ override }) });
    toast('Checked out.'); loadCheckout();
  } catch (e) {
    if (e.message === 'checked_out' && e.details?.holder &&
        confirm(`Held by ${e.details.holder.name} since ${fmtDate(e.details.checkedOutAt)}.\nOverride their checkout? (this is logged)`))
      return acquireCheckout(true);
    toast(e.message || 'Checkout failed', false);
  }
}
async function releaseCheckout() {
  try { await api(`/models/${currentModel}/checkout`, { method: 'DELETE' }); toast('Released.'); loadCheckout(); }
  catch (e) { toast(e.message || 'Release failed', false); }
}

async function loadVersions() {
  const el = $('versions');
  try {
    const [{ versions }, latest] = await Promise.all([
      api(`/models/${currentModel}/versions`),
      api(`/models/${currentModel}/versions/latest-approved`)
    ]);
    const approvedId = latest.version?.id;
    if (!versions.length) { el.innerHTML = '<span class="muted">No versions uploaded yet.</span>'; return; }
    el.innerHTML = `<table><tr><th>v</th><th>Status</th><th>Uploaded</th><th>Description</th><th>Network</th><th>Actions</th></tr>` +
      versions.map(v => {
        const n = v.metadata?.network;
        const meta = n ? `<div class="meta-chips"><span class="chip">${n.nodes.total} nodes</span><span class="chip">${n.links.total} links</span><span class="chip">${(n.totalPipeLength/1000).toFixed(1)} km pipe</span></div>` : '<span class="muted">no metadata</span>';
        const star = v.id === approvedId ? ' ⭐' : '';
        const acts = [];
        if (v.reviewStatus === 'Draft') acts.push(`<button class="btn" onclick="act('${v.id}','submit')">Submit for review</button>`);
        if (v.reviewStatus === 'InReview') {
          acts.push(`<button class="btn primary" onclick="act('${v.id}','approve')">Approve</button>`);
          acts.push(`<button class="btn" onclick="rejectVersion('${v.id}')">Reject</button>`);
        }
        acts.push(`<button class="btn" onclick="showHistory('${v.id}')">History</button>`);
        acts.push(`<button class="btn" onclick="viewNetwork('${v.id}', ${v.versionNumber})">🗺 Map</button>`);
        acts.push(`<button class="btn" onclick="downloadVersion('${v.id}', ${v.versionNumber})">⬇</button>`);
        return `<tr><td><b>${v.versionNumber}</b>${star}</td>
          <td><span class="badge ${v.reviewStatus}">${v.reviewStatus}</span></td>
          <td class="muted">${fmtDate(v.uploadedAt)}</td>
          <td>${v.changeDescription}</td><td>${meta}</td><td>${acts.join('')}</td></tr>`;
      }).join('') + '</table>';
  } catch (e) { el.innerHTML = `<span class="muted">${e.message || 'Load failed'}</span>`; }
}
async function act(versionId, action) {
  try { await api(`/versions/${versionId}/${action}`, { method: 'POST', body: '{}' }); toast(`Version ${action}ed.`); refresh(); }
  catch (e) { toast(e.message || `${action} failed`, false); }
}
async function rejectVersion(versionId) {
  const comment = prompt('Rejection comment (required):');
  if (comment === null) return;
  try {
    await api(`/versions/${versionId}/reject`, { method: 'POST', body: JSON.stringify({ comment }) });
    toast('Version rejected.'); refresh();
  } catch (e) { toast(e.message || 'Reject failed', false); }
}
async function downloadVersion(versionId, versionNumber) {
  // The download endpoint 302s to a signed ACC URL; fetch with auth header, follow, save.
  const res = await fetch(`/api/v1/versions/${versionId}/download`, { headers: hdrs() });
  if (!res.ok) return toast('Download failed', false);
  const blob = await res.blob(); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `model_v${versionNumber}.csv`; a.click();
  toast(`Version ${versionNumber} downloaded from ACC.`);
}
// ---- Network map: render the WS Pro CSV export as an SVG GeoPlan-style view ----
// Node tables carry x/y; link tables carry us/ds node ids. No Model Derivative
// needed — CSV isn't a CAD format, but it IS the network graph, so we draw it.
const NODE_TABLES = { wn_node: 'junction', wn_reservoir: 'tank', wn_fixed_head: 'reservoir' };
const LINK_TABLES = ['wn_pipe', 'wn_valve', 'wn_float_valve', 'wn_non_return_valve', 'wn_pst', 'wn_meter'];
async function viewNetwork(versionId, versionNumber) {
  toast('Loading network from ACC…');
  const res = await fetch(`/api/v1/versions/${versionId}/download`, { headers: hdrs() });
  if (!res.ok) return toast('Could not fetch model file', false);
  const text = await res.text();

  const nodes = {}, links = [];
  let table = null, cols = null;
  for (const line of text.split(/\r?\n/)) {
    if (line.startsWith('## table=')) { table = line.slice(9).trim(); cols = null; continue; }
    if (!table || !line) continue;
    if (!cols) { cols = {}; line.split(',').forEach((h, i) => cols[h] ??= i); continue; }
    const f = line.split(',');
    const val = name => cols[name] !== undefined ? f[cols[name]] : undefined;
    if (NODE_TABLES[table]) {
      const x = parseFloat(val('x')), y = parseFloat(val('y'));
      if (!isNaN(x) && !isNaN(y)) nodes[val('node_id')] = { x, y, type: NODE_TABLES[table] };
    } else if (LINK_TABLES.includes(table)) {
      const us = val('us_node_id'), ds = val('ds_node_id');
      if (us && ds) links.push({ us, ds, pump: table === 'wn_pst' });
    }
  }
  const pts = Object.values(nodes);
  if (!pts.length) return toast('No coordinates found in this version', false);

  // Fit model coordinates into the SVG viewBox (Y inverted: screen Y grows downward)
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const [minX, maxX, minY, maxY] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 30, W = 800, H = 600;
  const s = Math.min((W - 2*pad) / (maxX - minX || 1), (H - 2*pad) / (maxY - minY || 1));
  const X = x => pad + (x - minX) * s, Y = y => H - pad - (y - minY) * s;

  let svg = '';
  for (const l of links) {
    const a = nodes[l.us], b = nodes[l.ds];
    if (a && b) svg += `<line x1="${X(a.x)}" y1="${Y(a.y)}" x2="${X(b.x)}" y2="${Y(b.y)}" stroke="${l.pump ? '#f59e0b' : '#94a3b8'}" stroke-width="${l.pump ? 2.5 : 1.5}"/>`;
  }
  for (const [id, p] of Object.entries(nodes)) {
    const cx = X(p.x), cy = Y(p.y), t = `<title>${id} (${p.type})</title>`;
    if (p.type === 'tank') svg += `<rect x="${cx-5}" y="${cy-5}" width="10" height="10" fill="#2563eb">${t}</rect>`;
    else if (p.type === 'reservoir') svg += `<polygon points="${cx},${cy-6} ${cx-6},${cy+5} ${cx+6},${cy+5}" fill="#7c3aed">${t}</polygon>`;
    else svg += `<circle cx="${cx}" cy="${cy}" r="3.2" fill="#16a34a">${t}</circle>`;
  }
  $('map-svg').innerHTML = svg;
  $('map-title').textContent = `Network map — version ${versionNumber}`;
  $('map-stats').textContent = `${pts.length} nodes, ${links.length} links drawn · hover any element for its ID`;
  $('map-modal').style.display = 'block';
}

async function showHistory(versionId) {
  try {
    const { reviewEvents } = await api(`/versions/${versionId}/review-events`);
    alert(reviewEvents.length
      ? reviewEvents.map(e => `${fmtDate(e.timestamp)}  ${e.action}  by ${e.actor.name}${e.comment ? `\n    "${e.comment}"` : ''}`).join('\n')
      : 'No review events yet — still an unsubmitted draft.');
  } catch (e) { toast(e.message || 'History failed', false); }
}

async function loadAudit() {
  const el = $('audit');
  const project = projects.find(p => p.models.some(m => m.id === currentModel));
  if (!project) { el.innerHTML = ''; return; }
  $('audit-export').innerHTML = `— <a href="#" onclick="exportAudit('${project.id}');return false">download CSV</a>`;
  try {
    const { events } = await api(`/projects/${project.id}/audit-events`);
    el.innerHTML = `<table><tr><th>When</th><th>Event</th><th>Actor</th><th>Detail</th></tr>` +
      events.slice(-25).reverse().map(e =>
        `<tr><td class="muted">${fmtDate(e.timestamp)}</td><td>${e.eventType}</td>
         <td>${e.actor?.name ?? ''}</td><td class="muted">${e.payload ? JSON.stringify(e.payload) : ''}</td></tr>`).join('') + '</table>';
  } catch (e) { el.innerHTML = `<span class="muted">${e.message || 'Load failed'}</span>`; }
}
async function exportAudit(projectId) {
  const res = await fetch(`/api/v1/projects/${projectId}/audit-events/export`, { headers: hdrs() });
  if (!res.ok) return toast((await res.json()).message || 'Export forbidden', false);
  const blob = await res.blob(); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'audit.csv'; a.click();
}

// ---- Live updates: poll the activity cursor; refresh when anything changed ----
// Every upload/download/checkout/review writes an audit event, so a bumped
// lastEventId means the view is stale. 4s polling — cheap (single MAX query).
let lastEventId = null;
async function pollActivity() {
  try {
    const project = projects.find(p => p.models.some(m => m.id === currentModel));
    if (!project) return;
    const { lastEventId: id } = await api(`/projects/${project.id}/activity`);
    if (lastEventId !== null && id > lastEventId) {
      toast('New activity — refreshing…');
      await refresh();
      // refresh() reloads data; re-read the cursor so one burst = one refresh
    }
    lastEventId = id;
  } catch { /* transient — try again next tick */ }
}
setInterval(pollActivity, 4000);
const liveDot = document.createElement('span');
liveDot.textContent = '● live'; liveDot.style.cssText = 'color:#4ade80;font-size:12px';
document.querySelector('header .tag').after(liveDot);

$('user').onchange = () => { lastEventId = null; refresh(); };
$('model').onchange = () => { lastEventId = null; refresh(); };
loadProjects().catch(e => toast(e.message || 'Failed to load — is the API running?', false));
</script>
</body>
</html>
