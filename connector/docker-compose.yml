services:
  postgres:
    image: postgres:17-alpine
    container_name: acc-connector-db
    environment:
      POSTGRES_DB: acc_connector
      POSTGRES_USER: connector
      POSTGRES_PASSWORD: connector_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector -d acc_connector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
